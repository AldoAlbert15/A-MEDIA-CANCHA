
name: Actualizar partidos de A Media Cancha

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar partidos de las tres competiciones
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from urllib.parse import urlencode

          key = os.environ.get("API_FOOTBALL_KEY")
          if not key:
              raise RuntimeError(
                  "Falta el secreto API_FOOTBALL_KEY."
              )

          lima = ZoneInfo("America/Lima")
          now = datetime.now(lima)
          today = now.date().isoformat()
          season = now.year

          leagues = {
              135: "Serie A",
              2: "UEFA Champions League",
              281: "Liga 1 Perú"
          }

          matches = []

          for league_id, display_name in leagues.items():
              params = urlencode({
                  "date": today,
                  "league": league_id,
                  "season": season,
                  "timezone": "America/Lima"
              })

              url = (
                  "https://v3.football.api-sports.io/fixtures?"
                  + params
              )

              request = urllib.request.Request(
                  url,
                  headers={"x-apisports-key": key}
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      data = json.load(response)
              except Exception as error:
                  raise RuntimeError(
                      f"Error consultando {display_name}: {error}"
                  ) from None

              if data.get("errors"):
                  raise RuntimeError(
                      f"Error de API en {display_name}: "
                      + json.dumps(
                          data["errors"], ensure_ascii=False
                      )
                  )

              results = data.get("response")
              if not isinstance(results, list):
                  raise RuntimeError(
                      f"Respuesta inválida para {display_name}."
                  )

              for match in results:
                  if match.get("league", {}).get("id") != league_id:
                      continue

                  match["league"]["name"] = display_name
                  matches.append(match)

              print(
                  f"{display_name}: "
                  f"{sum(1 for m in matches if m.get('league', {}).get('id') == league_id)} partidos"
              )

          matches.sort(
              key=lambda m: m.get("fixture", {}).get("date", "")
          )

          output = {
              "date": today,
              "updated_at": now.isoformat(),
              "matches": matches
          }

          os.makedirs("data", exist_ok=True)
          with open(
              "data/matches.json", "w", encoding="utf-8"
          ) as file:
              json.dump(
                  output, file, ensure_ascii=False, indent=2
              )

          print("Consulta completada.")
          print("Total de partidos:", len(matches))
          PY

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar partidos de las tres ligas"
            git push
          fi

name: Actualizar partidos de A Media Cancha

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar partidos
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from urllib.parse import urlencode

          token = os.environ.get("FOOTBALL_DATA_TOKEN")
          if not token:
              raise RuntimeError(
                  "Falta el secreto FOOTBALL_DATA_TOKEN en GitHub."
              )

          lima = ZoneInfo("America/Lima")
          now = datetime.now(lima)
          date_from = (now.date() - timedelta(days=45)).isoformat()
          date_to = (now.date() + timedelta(days=7)).isoformat()
        

          competitions = {
              "SA": "Serie A",
              "CL": "UEFA Champions League",
              "BL1": "Bundesliga",
              "PL": "Premier League"
          }

          status_map = {
              "SCHEDULED": "NS",
              "TIMED": "NS",
              "IN_PLAY": "LIVE",
              "PAUSED": "HT",
              "FINISHED": "FT",
              "POSTPONED": "PST",
              "SUSPENDED": "SUSP",
              "CANCELLED": "CANC",
              "AWARDED": "FT"
          }

          matches = []

          for code, league_name in competitions.items():
              params = urlencode({
                  "dateFrom": date_from,
                  "dateTo": date_to
              })

              url = (
                  f"https://api.football-data.org/v4/"
                  f"competitions/{code}/matches?{params}"
              )

              request = urllib.request.Request(
                  url,
                  headers={"X-Auth-Token": token}
              )

              try:
                  with urllib.request.urlopen(
                      request, timeout=30
                  ) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(
                      "utf-8", errors="replace"
                  )
                  raise RuntimeError(
                      f"Error en {league_name} "
                      f"(HTTP {error.code}): {detail}"
                  ) from None
              except Exception as error:
                  raise RuntimeError(
                      f"No se pudo consultar {league_name}: {error}"
                  ) from None

              for item in data.get("matches", []):
                  home = item.get("homeTeam") or {}
                  away = item.get("awayTeam") or {}
                  score = item.get("score") or {}
                  full_time = score.get("fullTime") or {}
                  competition = item.get("competition") or {}
                  utc_date = item.get("utcDate", "")

                  matches.append({
                      "fixture": {
                          "id": item.get("id"),
                          "date": utc_date,
                          "status": {
                              "short": status_map.get(
                                  item.get("status"), "NS"
                              ),
                              "long": item.get("status", "")
                          }
                      },
                      "teams": {
                          "home": {
                              "id": home.get("id"),
                              "name": home.get("name", "Local"),
                              "logo": home.get("crest")
                          },
                          "away": {
                              "id": away.get("id"),
                              "name": away.get("name", "Visitante"),
                              "logo": away.get("crest")
                          }
                      },
                      "goals": {
                          "home": full_time.get("home"),
                          "away": full_time.get("away")
                      },
                      "league": {
                          "id": code,
                          "name": league_name,
                          "country": competition.get("area", {}).get(
                              "name", ""
                          ),
                          "round": item.get("matchday")
                      }
                  })

              print(f"{league_name}: consulta completada")

          matches.sort(
              key=lambda m: m["fixture"].get("date", "")
          )

          output = {
              "date": now.date().isoformat(),
              "updated_at": now.isoformat(),
              "source": "football-data.org",
              "matches": matches
          }

          os.makedirs("data", exist_ok=True)
          with open(
              "data/matches.json", "w", encoding="utf-8"
          ) as file:
              json.dump(
                  output, file, ensure_ascii=False, indent=2
              )

          print("Total de partidos recibidos:", len(matches))
          print("Archivo data/matches.json generado.")
          PY

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos."
          else
            git commit -m "Actualizar partidos de cuatro ligas"
            git push
          fi


name: Actualizar partidos de A Media Cancha

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Consultar partidos del día
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("America/Lima")).date().isoformat()
          url = (
              "https://v3.football.api-sports.io/fixtures"
              f"?date={today}&timezone=America%2FLima"
          )
          req = urllib.request.Request(
              url,
              headers={"x-apisports-key": os.environ["API_FOOTBALL_KEY"]}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          if data.get("errors"):
          print("DETALLE DEL ERROR DE API-FOOTBALL:")
          print(json.dumps(data["errors"], ensure_ascii=False))
          raise RuntimeError(
          "La API rechazó la consulta. Revisa el detalle anterior.")

if not isinstance(data.get("response"), list):
    raise RuntimeError("La respuesta de la API tiene un formato inesperado.")

          output = {
              "date": today,
              "updated_at": datetime.now(ZoneInfo("America/Lima")).isoformat(),
              "matches": data.get("response", [])
          }

          with open("data/matches.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print(f"Partidos recibidos: {len(output['matches'])}")
          PY

      - name: Guardar datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/matches.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Actualizar partidos reales"
            git push
          fi
